worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name YOUR_DOMAIN_OR_IP;

        # Static assets served directly by Nginx
        # /var/www/gestor-processos-externo is mounted into the container via nginx-gestor-processos-externo.yml
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            root /var/www/gestor-processos-externo;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # PHP → PHP-FPM via FastCGI
        location ~ \.php$ {
            fastcgi_pass   host.docker.internal:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/gestor-processos-externo$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location @php {
            fastcgi_pass   host.docker.internal:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/gestor-processos-externo$fastcgi_script_name;
            include        fastcgi_params;
        }

        # Block direct access to sensitive files and directories
        location ~* /(config|server|\.git)/ {
            deny all;
            return 403;
        }

        location ~* (secrets|connection|includes_example)\.php$ {
            deny all;
            return 403;
        }
    }
}
