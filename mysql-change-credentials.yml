---
- name: Change MySQL user credentials per host
  hosts: all
  tasks:
    - name: Check if new password is already active
      shell: mysql -u "{{ mysql_new_username | default(mysql_user) }}" -p"{{ mysql_new_password }}" -e "SELECT 1;" 2>/dev/null
      register: new_creds_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check if old user exists
      shell: mysql -u root -e "SELECT COUNT(*) FROM mysql.user WHERE User='{{ mysql_user }}' AND Host='%';" 2>/dev/null
      register: old_user_check
      changed_when: false
      failed_when: false
      when: new_creds_check.rc != 0

    - name: Rename user
      shell: mysql -u root -e "RENAME USER '{{ mysql_user }}'@'%' TO '{{ mysql_new_username }}'@'%';"
      when:
        - new_creds_check.rc != 0
        - mysql_new_username is defined
        - mysql_new_username != mysql_user
        - old_user_check.stdout is search('1')

    - name: Change password
      shell: |
        mysql -u root -e "ALTER USER '{{ mysql_new_username | default(mysql_user) }}'@'%' IDENTIFIED BY '{{ mysql_new_password }}';"
        mysql -u root -e "FLUSH PRIVILEGES;"
      no_log: true
      when: new_creds_check.rc != 0

    - name: Display result
      debug:
        msg: "{{ 'Credentials already up to date, skipped.' if new_creds_check.rc == 0 else 'Credentials updated for: ' + (mysql_new_username | default(mysql_user)) }}"
