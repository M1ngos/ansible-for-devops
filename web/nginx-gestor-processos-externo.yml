---
- name: Install Nginx on Docker for gestor-processos-externo
  hosts: all
  vars:
    nginx_dir: "/opt/nginx"
    app_root: "/var/www/gestor-processos-externo"

  tasks:
    - name: Create Nginx directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ nginx_dir }}"
        - "{{ nginx_dir }}/conf"
        - "{{ nginx_dir }}/html"
        - "{{ nginx_dir }}/logs"

    - name: Deploy gestor-processos-externo Nginx configuration
      copy:
        src: nginx-gestor-processos-externo-site.conf
        dest: "{{ nginx_dir }}/conf/nginx.conf"
        mode: '0644'

    - name: Run Nginx Docker container
      docker_container:
        name: nginx
        image: "nginx:latest"
        state: started
        restart_policy: always
        ports:
          - "80:80"
          - "5000:5000"
          - "8080:8080"
        volumes:
          - "{{ nginx_dir }}/conf/nginx.conf:/etc/nginx/nginx.conf"
          - "{{ nginx_dir }}/html:/usr/share/nginx/html"
          - "{{ nginx_dir }}/logs:/var/log/nginx"
          - "{{ app_root }}:{{ app_root }}:ro"
        etc_hosts:
          host.docker.internal: host-gateway

    - name: Verify Nginx container is running
      shell: docker ps --filter name=nginx --format "{{ '{{.Names}} {{.Status}}' }}"
      register: nginx_status
      changed_when: false

    - name: Display Nginx status
      debug:
        msg: "{{ nginx_status.stdout }}"
