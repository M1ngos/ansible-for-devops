---
- name: Remove PHP-FPM and extensions
  hosts: all
  become: true

  tasks:
    - name: Stop and disable PHP-FPM
      systemd:
        name: php8.2-fpm
        enabled: no
        state: stopped
      ignore_errors: yes

    - name: Remove PHP 8.2 packages
      apt:
        name:
          - php8.2-fpm
          - php8.2-mysql
          - php8.2-curl
          - php8.2-mbstring
          - php8.2-gd
          - php8.2-zip
          - php8.2-xml
          - php8.2-exif
        state: absent
        purge: yes
        autoremove: yes

    - name: Remove ondrej/php PPA
      apt_repository:
        repo: ppa:ondrej/php
        state: absent

    - name: Remove unused dependencies
      apt:
        autoremove: yes
        autoclean: yes