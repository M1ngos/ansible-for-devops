---
- name: Install Docker and Docker Compose on Ubuntu
  hosts: all
  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      retries: 3
      delay: 10
      register: apt_update_result
      until: apt_update_result is succeeded

    - name: Install required system packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - iputils-ping
        state: present

    - name: Check network connectivity
      command: ping -c 2 8.8.8.8
      register: ping_result
      ignore_errors: yes
      changed_when: false

    - name: Check DNS resolution
      command: ping -c 2 archive.ubuntu.com
      register: dns_result
      ignore_errors: yes
      changed_when: false

    - name: Display connectivity status
      debug:
        msg: "Network: {{ 'OK' if ping_result.rc == 0 else 'FAILED' }} | DNS: {{ 'OK' if dns_result.rc == 0 else 'FAILED' }}"

    - name: Fail if no network connectivity
      fail:
        msg: "No network connectivity. Check firewall, routing, or network configuration."
      when: ping_result.rc != 0

    - name: Fail if DNS not working
      fail:
        msg: "DNS resolution failed. Check /etc/resolv.conf or DNS settings."
      when: dns_result.rc != 0

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Get Ubuntu release codename
      command: lsb_release -cs
      register: ubuntu_release
      changed_when: false

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ubuntu_release.stdout }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes

    - name: Install Docker Engine and Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose installation
      command: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: Display Docker Compose version
      debug:
        msg: "{{ docker_compose_version.stdout }}"
